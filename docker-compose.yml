services:
  imagine-media:
    build:
      context: .
    ports:
      - "${IMAGINE_MEDIA_HOST_PORT:-3030}:${APP_PORT:-3030}"
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - "${DATA_HOST_DIR:-./data}:/data"
    environment:
      APP_PORT: "${APP_PORT:-3030}"
      DATA_DIR: /data
      APP_SECRET: "${APP_SECRET:?APP_SECRET must be set to at least 32 random characters}"
      APP_PASSWORD: "${APP_PASSWORD:-}"
      MOCK_PROVIDER_ENABLED: "${MOCK_PROVIDER_ENABLED:-true}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      ALLOW_HTTP_MEDIA_DOWNLOADS: "${ALLOW_HTTP_MEDIA_DOWNLOADS:-false}"
      ALLOW_INSECURE_PROVIDER_HTTP: "${ALLOW_INSECURE_PROVIDER_HTTP:-false}"
      ALLOW_PRIVATE_NETWORK_ACCESS: "${ALLOW_PRIVATE_NETWORK_ACCESS:-false}"
      MAX_IMAGE_UPLOAD_BYTES: "${MAX_IMAGE_UPLOAD_BYTES:-33554432}"
      MAX_VIDEO_UPLOAD_BYTES: "${MAX_VIDEO_UPLOAD_BYTES:-536870912}"
      MAX_REMOTE_IMAGE_BYTES: "${MAX_REMOTE_IMAGE_BYTES:-67108864}"
      MAX_REMOTE_VIDEO_BYTES: "${MAX_REMOTE_VIDEO_BYTES:-1073741824}"
      MEDIA_PROCESS_TIMEOUT_MS: "${MEDIA_PROCESS_TIMEOUT_MS:-30000}"
    restart: unless-stopped
